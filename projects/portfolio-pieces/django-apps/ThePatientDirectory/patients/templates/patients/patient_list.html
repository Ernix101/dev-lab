<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Directory</title>
</head>
<body>
    <h1>Patient Directory</h1>
    <a href="{% url 'patient_create' %}">Add a New Patient</a>

    <ul>
        {% for patient in patients %}
            <li>
                <a href="{% url 'patient_detail' patient.pk %}">{{ patient.name }}</a>
                - {{ patient.blood_type }}
            </li>
        {% empty %}
            <li>No Patients recorded yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
